<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DiSC Personality Assessment | Đánh giá tính cách DiSC</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Be+Vietnam+Pro:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #f7f4ef;
  --surface: #ffffff;
  --surface2: #efeae3;
  --border: #ddd6cc;
  --text: #1c1814;
  --dim: #8a7e74;
  --accent: #2d4a8c;
  --accent-light: #e8edf8;
  --d: #c0392b; --d-bg: #fdecea; --d-light: #f8d7d5;
  --i: #e67e22; --i-bg: #fef3e2; --i-light: #fde8c5;
  --s: #27ae60; --s-bg: #e8f8ef; --s-light: #c8efd8;
  --c: #2980b9; --c-bg: #e8f4fc; --c-light: #c5e0f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Be Vietnam Pro', 'Noto Sans JP', sans-serif; min-height: 100vh; }
#app { max-width: 740px; margin: 0 auto; padding: 32px 20px 80px; }

.topbar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--text); padding-bottom: 12px; margin-bottom: 36px; }
.topbar-title { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); }
.topbar-step { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--dim); }

.step-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 32px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); transition: all .3s; }
.dot.done { background: var(--accent); }
.dot.active { background: var(--accent); transform: scale(1.3); }

.eyebrow { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.section-title { font-size: clamp(22px,4vw,34px); font-weight: 900; line-height: 1.2; letter-spacing: -0.5px; margin-bottom: 14px; }
.section-desc { font-size: 14px; color: var(--dim); line-height: 1.95; margin-bottom: 28px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 22px; margin-bottom: 14px; }

/* 名前入力 */
.name-input-wrap { position: relative; margin-bottom: 24px; }
.name-input { width: 100%; padding: 16px 18px; font-family: 'Be Vietnam Pro', 'Noto Sans JP', sans-serif; font-size: 16px; border: 2px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); outline: none; transition: border .2s; }
.name-input:focus { border-color: var(--accent); }
.name-label { position: absolute; top: -10px; left: 14px; background: var(--bg); padding: 0 6px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; }

/* 質問カード - 強制選択式 */
.q-progress { display: flex; gap: 3px; margin-bottom: 20px; }
.q-pip { flex: 1; height: 4px; border-radius: 2px; background: var(--border); transition: background .3s; }
.q-pip.done { background: var(--accent); }

.q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 26px; margin-bottom: 16px; position: relative; overflow: hidden; }
.q-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--accent); }
.q-num { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--dim); margin-bottom: 14px; letter-spacing: 2px; }

.q-instruction { display: flex; gap: 8px; margin-bottom: 16px; }
.q-badge { padding: 4px 12px; border-radius: 6px; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
.badge-most { background: #1a237e; color: white; }
.badge-least { background: #f5f5f5; color: #666; border: 1px solid #ddd; }

.choice-list { display: flex; flex-direction: column; gap: 8px; }
.choice-item { display: grid; grid-template-columns: 48px 48px 1fr; align-items: center; gap: 10px; padding: 14px 16px; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 10px; transition: background .15s; }
.choice-item:hover { background: #ede8e0; }
.choice-item.most-selected { background: #e8edf8; border-color: #2d4a8c; }
.choice-item.least-selected { background: #f8f3ee; border-color: #bbb; }
.choice-item.both { background: #e8edf8; border-color: #2d4a8c; }

.choice-btn { width: 36px; height: 36px; border-radius: 8px; border: 2px solid var(--border); background: white; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .5px; transition: all .15s; color: var(--dim); display: flex; align-items: center; justify-content: center; }
.choice-btn.most-active { background: #1a237e; border-color: #1a237e; color: white; }
.choice-btn.least-active { background: #555; border-color: #555; color: white; }
.choice-btn:disabled { opacity: .35; cursor: not-allowed; }

.choice-text-vi { font-size: 15px; font-weight: 600; line-height: 1.55; color: var(--text); }
.choice-text-en { font-size: 11px; color: var(--dim); line-height: 1.5; font-style: italic; margin-top: 2px; }

.choice-legend { display: flex; gap: 16px; margin-bottom: 16px; font-size: 12px; color: var(--dim); }
.legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }

/* 結果 */
.type-banner { border-radius: 14px; padding: 32px; margin-bottom: 20px; text-align: center; }
.type-banner.d { background: var(--d-bg); border: 2px solid var(--d); }
.type-banner.i { background: var(--i-bg); border: 2px solid var(--i); }
.type-banner.s { background: var(--s-bg); border: 2px solid var(--s); }
.type-banner.c { background: var(--c-bg); border: 2px solid var(--c); }
.type-emoji { font-size: 52px; margin-bottom: 12px; }
.type-name-vi { font-size: 26px; font-weight: 900; margin-bottom: 4px; }
.type-name-en { font-size: 13px; color: var(--dim); margin-bottom: 2px; }
.type-name-jp { font-size: 12px; color: var(--dim); margin-bottom: 16px; }
.type-tagline { font-size: 14px; font-weight: 700; }

.score-bars { margin-bottom: 20px; }
.score-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.score-row-label { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; width: 14px; text-align: center; }
.score-bar-wrap { flex: 1; height: 10px; background: var(--surface2); border-radius: 5px; overflow: hidden; }
.score-bar-fill { height: 100%; border-radius: 5px; transition: width 1.2s ease; }
.score-row-num { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--dim); width: 40px; text-align: right; }

.traits-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.trait-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.trait-card h4 { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; color: var(--dim); margin-bottom: 10px; text-transform: uppercase; }
.trait-card ul { list-style: none; }
.trait-card li { font-size: 13px; line-height: 1.85; padding-left: 14px; position: relative; }
.trait-card li::before { content: '·'; position: absolute; left: 0; color: var(--dim); }

.desc-section { margin-bottom: 16px; }
.desc-section h4 { font-size: 10px; font-family: 'DM Mono', monospace; letter-spacing: 2px; color: var(--dim); margin-bottom: 8px; text-transform: uppercase; }
.desc-section ul { list-style: none; }
.desc-section li { font-size: 13px; line-height: 1.85; padding-left: 14px; position: relative; color: #444; }
.desc-section li::before { content: '·'; position: absolute; left: 0; color: var(--dim); }

.profile-badge { display: inline-block; padding: 6px 20px; border-radius: 20px; font-family: 'DM Mono', monospace; font-weight: 500; font-size: 13px; color: white; margin-top: 8px; }

/* ボタン */
.btn-primary { display: block; width: 100%; padding: 15px; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-family: 'Be Vietnam Pro', 'Noto Sans JP', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: all .2s; letter-spacing: 1px; }
.btn-primary:hover { background: #3d5fb0; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(45,74,140,.3); }
.btn-secondary { display: inline-block; padding: 13px 32px; background: transparent; border: 2px solid var(--accent); border-radius: 8px; color: var(--accent); font-family: 'Be Vietnam Pro', 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .2s; }
.btn-secondary:hover { background: var(--accent); color: #fff; }

/* イントロ */
.intro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
.intro-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
.intro-num { font-family: 'DM Mono', monospace; font-size: 28px; font-weight: 500; color: var(--accent); margin-bottom: 6px; line-height: 1; }
.intro-label { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.intro-desc { font-size: 13px; color: var(--dim); line-height: 1.75; }

.type-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
.type-chip { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700; }
.chip-d { background: var(--d-bg); color: var(--d); }
.chip-i { background: var(--i-bg); color: var(--i); }
.chip-s { background: var(--s-bg); color: var(--s); }
.chip-c { background: var(--c-bg); color: var(--c); }

@keyframes fadeUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
.anim { animation: fadeUp .35s ease; }

@media (max-width: 520px) {
  .intro-grid, .traits-grid { grid-template-columns: 1fr; }
  .scale-btn { font-size: 12px; }
}
</style>
</head>

      { type:'S', vi:'Hỏi kỹ để hiểu rõ kỳ vọng trước khi bắt đầu', en:'Ask carefully to fully understand expectations before starting' },
      { type:'C', vi:'Nghiên cứu kỹ lưỡng và lập kế hoạch trước khi hành động', en:'Research thoroughly and plan carefully before taking action' },

  },
  {
    scenario: { vi: 'Điều làm tôi cảm thấy thành công nhất trong công việc là...', en: 'What makes me feel most successful at work is...' },
    choices: [
      { type:'D', vi:'Đạt được mục tiêu quan trọng, đặc biệt là vượt qua thử thách', en:'Achieving major goals, especially overcoming challenges' },
      { type:'i', vi:'Được mọi người công nhận và tạo ra tác động tích cực', en:'Being recognized by others and creating a positive impact' },
      { type:'S', vi:'Thấy đội nhóm hoạt động tốt và mọi người đều hài lòng', en:'Seeing the team functioning well and everyone satisfied' },
      { type:'C', vi:'Hoàn thành công việc chính xác, không có lỗi', en:'Completing work accurately with no errors' },
    ]
  },
  {
    scenario: { vi: 'Khi có quá nhiều việc phải làm cùng một lúc, tôi...', en: 'When I have too many things to do at once, I...' },
    choices: [
      { type:'D', vi:'Ưu tiên những gì có tác động lớn nhất và bỏ qua phần còn lại', en:'Prioritize what has the biggest impact and drop the rest' },
      { type:'i', vi:'Nhờ người khác giúp và biến nó thành hoạt động nhóm vui vẻ', en:'Get others involved and turn it into a fun group activity' },
      { type:'S', vi:'Lập danh sách việc cần làm và xử lý từng việc một cách cẩn thận', en:'Make a to-do list and handle each task carefully one by one' },
      { type:'C', vi:'Sắp xếp theo hệ thống và đảm bảo mỗi việc được thực hiện đúng', en:'Organize systematically and ensure each task is done correctly' },
    ]
  },
  {
    scenario: { vi: 'Khi môi trường làm việc thay đổi đột ngột, tôi...', en: 'When the work environment changes suddenly, I...' },
    choices: [
      { type:'D', vi:'Thích nghi nhanh chóng và tìm cơ hội trong sự thay đổi', en:'Adapt quickly and find opportunities in the change' },
      { type:'i', vi:'Hứng khởi với điều mới và khuyến khích mọi người đón nhận', en:'Get excited about what\'s new and encourage others to embrace it' },
      { type:'S', vi:'Cần thời gian để quen dần và muốn có sự hỗ trợ từ nhóm', en:'Need time to adjust and want support from the team' },
      { type:'C', vi:'Muốn hiểu rõ lý do thay đổi và các quy trình mới trước khi thực hiện', en:'Want to understand the reason for change and new procedures before acting' },
    ]
  },
  {
    scenario: { vi: 'Khi trình bày ý tưởng trước người khác, tôi...', en: 'When presenting ideas to others, I...' },
    choices: [
      { type:'D', vi:'Đi thẳng vào vấn đề và kết luận ngay từ đầu', en:'Get straight to the point and lead with the conclusion' },
      { type:'i', vi:'Kể chuyện sinh động và dùng cảm xúc để thu hút người nghe', en:'Tell vivid stories and use emotion to engage the audience' },
      { type:'S', vi:'Đảm bảo mọi người hiểu và cảm thấy thoải mái với ý tưởng', en:'Make sure everyone understands and feels comfortable with the idea' },
      { type:'C', vi:'Chuẩn bị dữ liệu, số liệu và phân tích chi tiết để hỗ trợ lập luận', en:'Prepare data, numbers and detailed analysis to support the argument' },
    ]
  },
  {
    scenario: { vi: 'Điều khiến tôi khó chịu nhất trong công việc là...', en: 'What frustrates me most at work is...' },
    choices: [
      { type:'D', vi:'Quyết định bị trì hoãn hoặc không ai dám hành động', en:'Decisions being delayed or no one willing to take action' },
      { type:'i', vi:'Môi trường quá nghiêm túc, thiếu năng lượng và sự vui vẻ', en:'An overly serious environment lacking energy and fun' },
      { type:'S', vi:'Xung đột kéo dài hoặc không khí nhóm căng thẳng', en:'Prolonged conflict or a tense team atmosphere' },
      { type:'C', vi:'Công việc được thực hiện ẩu, thiếu chuẩn mực hoặc có lỗi', en:'Work done sloppily, without standards or full of errors' },
    ]
  },
  {
    scenario: { vi: 'Người khác thường mô tả tôi là...', en: 'Others would most likely describe me as...' },
    choices: [
      { type:'D', vi:'Quyết đoán, tự tin và không ngại thách thức', en:'Decisive, confident and unafraid of challenges' },
      { type:'i', vi:'Nhiệt tình, vui vẻ và truyền cảm hứng', en:'Enthusiastic, fun and inspiring' },
      { type:'S', vi:'Đáng tin cậy, kiên nhẫn và luôn sẵn sàng giúp đỡ', en:'Reliable, patient and always ready to help' },
      { type:'C', vi:'Cẩn thận, chính xác và có tổ chức', en:'Careful, accurate and well-organized' },
    ]
  },
];

let st = {
  screen: 'intro',
  name: '',
  // answers[q] = { most: typeKey or null, least: typeKey or null }
  answers: Array.from({length: 14}, () => ({ most: null, least: null })),
  currentQ: 0,
};

// ==========================================
// レンダー
// ==========================================
function topBar(s) {
  return `<div class="topbar"><span class="topbar-title">DiSC PERSONALITY ASSESSMENT</span><span class="topbar-step">${s}</span></div>`;
}
function dots(active) {
  return `<div class="step-dots">${[0,1,2,3].map(i=>`<div class="dot ${i<active?'done':i===active?'active':''}"></div>`).join('')}</div>`;
}

function renderIntro() {
  return `${topBar('STEP 1 / 4 — はじめに / Giới thiệu')}${dots(0)}
  <div class="anim">
    <div class="eyebrow">WHAT IS DiSC?</div>
    <h1 class="section-title">あなたのタイプを<br>知ることから始まる</h1>
    <p class="section-desc">DiSCは世界中で活用されているパーソナリティ診断ツールです。4つのタイプを知ることで、自己理解・相互理解・コミュニケーション改善に役立てることができます。<br><br>DiSC là công cụ đánh giá tính cách được sử dụng trên toàn thế giới. Hiểu 4 kiểu người giúp cải thiện sự tự nhận thức và giao tiếp.</p>

    <div class="type-chips">
      <div class="type-chip chip-d">🦁 D — Controller | Người Kiểm Soát</div>
      <div class="type-chip chip-i">🌟 i — Promoter | Người Quảng Bá</div>
      <div class="type-chip chip-s">🌿 S — Supporter | Người Hỗ Trợ</div>
      <div class="type-chip chip-c">🔬 C — Analyzer | Người Phân Tích</div>
    </div>

    <div class="intro-grid">
      <div class="intro-item">
        <div class="intro-num">14</div>
        <div class="intro-label">質問数 / Số câu hỏi</div>
        <div class="intro-desc">各問4択から「最も」「最も当てはまらない」を選ぶ形式。<br>Mỗi câu chọn "MOST" và "LEAST" trong 4 lựa chọn.</div>
      </div>
      <div class="intro-item">
        <div class="intro-num">~3分</div>
        <div class="intro-label">所要時間 / Thời gian</div>
        <div class="intro-desc">直感で答えてください。正解・不正解はありません。<br>Trả lời theo bản năng. Không có đúng sai.</div>
      </div>
      <div class="intro-item">
        <div class="intro-num">2</div>
        <div class="intro-label">言語 / Ngôn ngữ</div>
        <div class="intro-desc">質問は英語・ベトナム語の2言語で表示されます。<br>Câu hỏi bằng tiếng Anh và tiếng Việt.</div>
      </div>
      <div class="intro-item">
        <div class="intro-num">即時</div>
        <div class="intro-label">結果 / Kết quả</div>
        <div class="intro-desc">回答後すぐに診断結果が表示されます。<br>Kết quả hiển thị ngay sau khi hoàn thành.</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:24px">
      <div class="eyebrow" style="margin-bottom:10px">回答のしかた / Cách trả lời</div>
      <p style="font-size:14px;line-height:1.95;color:var(--dim)">各文章があなたにどれくらい当てはまるか、<strong style="color:var(--text)">1（全く当てはまらない）〜 5（非常に当てはまる）</strong>で評価してください。<br><br>Đánh giá mức độ phù hợp với bạn: <strong style="color:var(--text)">1（Hoàn toàn không đồng ý）〜 5（Hoàn toàn đồng ý）</strong></p>
    </div>

    <div class="name-input-wrap">
      <div class="name-label">TÊN CỦA BẠN / お名前 ★必須</div>
      <input class="name-input" type="text" id="nameInput" placeholder="Ví dụ: Nguyen Van A" value="${st.name}" oninput="this.style.borderColor=''" />
    </div>

    <button class="btn-primary" onclick="startAssessment()">診断を開始する / Bắt đầu đánh giá →</button>
  </div>`;
}

function renderQuestion() {
  const q = QUESTIONS[st.currentQ];
  const ans = st.answers[st.currentQ];
  const isComplete = ans.most !== null && ans.least !== null;
  const pips = QUESTIONS.map((_,i) => `<div class="q-pip ${i < st.currentQ ? 'done' : ''}"></div>`).join('');

  const choicesHtml = q.choices.map((c, idx) => {
    const isMost = ans.most === c.type;
    const isLeast = ans.least === c.type;
    let rowCls = '';
    if (isMost) rowCls = 'most-selected';
    else if (isLeast) rowCls = 'least-selected';

    const mostDisabled = !isMost && ans.most !== null ? 'disabled' : '';
    const leastDisabled = !isLeast && ans.least !== null ? 'disabled' : '';
    // MostとLeastが同じ選択肢にならないよう制御
    const mostCannotPick = ans.least === c.type;
    const leastCannotPick = ans.most === c.type;

    return `<div class="choice-item ${rowCls}">
      <button class="choice-btn ${isMost ? 'most-active' : ''}"
        onclick="pickMost('${c.type}')"
        ${mostCannotPick ? 'disabled' : ''}
        title="Most">MOST</button>
      <button class="choice-btn ${isLeast ? 'least-active' : ''}"
        onclick="pickLeast('${c.type}')"
        ${leastCannotPick ? 'disabled' : ''}
        title="Least">LEAST</button>
      <div>
        <div class="choice-text-vi">${c.vi}</div>
        <div class="choice-text-en">${c.en}</div>
      </div>
    </div>`;
  }).join('');

  return `${topBar(`STEP 2 / 4 — ${st.currentQ+1} / ${QUESTIONS.length}`)}${dots(1)}
  <div class="anim">
    <div class="q-progress">${pips}</div>
    <div class="q-card">
      <div class="q-num">QUESTION ${st.currentQ + 1} / ${QUESTIONS.length}</div>
      <div style="margin-bottom:14px">
        <div style="font-size:16px;font-weight:700;line-height:1.55;color:var(--text);margin-bottom:4px">${q.scenario.vi}</div>
        <div style="font-size:12px;color:var(--dim);font-style:italic">${q.scenario.en}</div>
      </div>
      <div class="choice-legend">
        <span><span class="legend-dot" style="background:#1a237e"></span>MOST — Mô tả tôi nhất / 最も当てはまる</span>
        <span><span class="legend-dot" style="background:#555"></span>LEAST — Ít mô tả tôi nhất / 最も当てはまらない</span>
      </div>
      <div class="choice-list">${choicesHtml}</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:4px">
      ${st.currentQ > 0 ? `<button class="btn-secondary" onclick="prevQ()" style="flex:1;padding:12px">← Quay lại</button>` : '<div style="flex:1"></div>'}
      <button class="btn-primary" onclick="nextQ()" style="flex:2" ${!isComplete ? 'disabled style="flex:2;opacity:.5;cursor:not-allowed"' : ''}>
        ${st.currentQ + 1 >= QUESTIONS.length ? 'Xem kết quả / 結果を見る →' : 'Tiếp theo / 次へ →'}
      </button>
    </div>
  </div>`;
}

function renderResult() {
  const scores = calcScores();

  const sorted = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
  const primary = sorted[0];
  const secondary = sorted[1];
  const T = DISC_TYPES[primary];
  const T2 = DISC_TYPES[secondary];
  const maxScore = 35;

  const barColors = {D:'#c0392b', i:'#e67e22', S:'#27ae60', C:'#2980b9'};
  const scoreBars = Object.entries(scores).map(([k,v]) => {
    const pct = Math.round(v / maxScore * 100);
    return `<div class="score-row">
      <div class="score-row-label" style="color:${barColors[k]};font-weight:700">${k}</div>
      <div class="score-bar-wrap"><div class="score-bar-fill" id="bar-${k}" style="background:${barColors[k]};width:0%"></div></div>
      <div class="score-row-num">${v}pt</div>
    </div>`;
  }).join('');

  function toList(arr) { return arr.map(t=>`<li>${t}</li>`).join(''); }

  return `${topBar('STEP 4 / 4 — 結果 / Kết quả')}${dots(3)}
  <div class="anim">
    <div class="eyebrow">YOUR DiSC RESULT</div>
    <div style="font-size:14px;color:var(--dim);margin-bottom:16px">回答者 / Người tham gia: <strong style="color:var(--text)">${escHtml(st.name)}</strong></div>

    <div class="type-banner ${T.bannerCls}">
      <div class="type-emoji">${T.emoji}</div>
      <div class="type-name-vi" style="color:${T.color}">${T.nameVI}</div>
      <div class="type-name-en">${T.nameEN}</div>
      <div class="type-name-jp">${T.nameJP}</div>
      <div class="type-tagline" style="color:${T.color}">${T.taglineVI}</div>
      <div style="font-size:12px;color:var(--dim);margin-top:4px">${T.taglineJP}</div>
      <div class="profile-badge" style="background:${T.color}">Profile: ${primary} / ${secondary}</div>
    </div>

    <div class="card">
      <h3 style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--dim);margin-bottom:14px;text-transform:uppercase">📊 Score Breakdown</h3>
      <div class="score-bars">${scoreBars}</div>
    </div>

    <div class="card">
      <h3 style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;color:${T.color};margin-bottom:16px;text-transform:uppercase">${T.emoji} メインタイプの特徴 / Primary Type Traits</h3>
      <div class="traits-grid">
        <div class="trait-card">
          <h4>🇯🇵 行動傾向</h4>
          <ul>${toList(T.traitsJP)}</ul>
        </div>
        <div class="trait-card">
          <h4>🇻🇳 Đặc điểm hành vi</h4>
          <ul>${toList(T.traitsVI)}</ul>
        </div>
      </div>
      <div class="traits-grid">
        <div class="trait-card">
          <h4>🇯🇵 対人関係</h4>
          <ul>${toList(T.relJP)}</ul>
        </div>
        <div class="trait-card">
          <h4>🇻🇳 Quan hệ giữa người với người</h4>
          <ul>${toList(T.relVI)}</ul>
        </div>
      </div>
    </div>

    <div class="card" style="border-left:4px solid ${T2.color}">
      <h3 style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;color:${T2.color};margin-bottom:12px;text-transform:uppercase">${T2.emoji} サブタイプ / Secondary Type: ${T2.nameJP}</h3>
      <div style="font-size:13px;color:var(--dim);margin-bottom:8px">${T2.nameEN} / ${T2.nameVI}</div>
      <div class="desc-section">
        <h4>🇯🇵 特徴</h4>
        <ul>${toList(T2.traitsJP)}</ul>
      </div>
      <div class="desc-section">
        <h4>🇻🇳 Đặc điểm</h4>
        <ul>${toList(T2.traitsVI)}</ul>
      </div>
    </div>

    <div style="text-align:center;margin-top:24px">
      <button class="btn-secondary" onclick="restart()">もう一度 / Làm lại</button>
    </div>
  </div>`;
}

// ==========================================
// ロジック
// ==========================================
function startAssessment() {
  const nameVal = document.getElementById('nameInput').value.trim();
  if (!nameVal) {
    const input = document.getElementById('nameInput');
    input.style.borderColor = '#c0392b';
    input.placeholder = '⚠ Vui lòng nhập tên của bạn / 名前を入力してください';
    input.focus();
    return;
  }
  st.name = nameVal;
  st.screen = 'question';
  st.currentQ = 0;
  st.answers = Array.from({length: 14}, () => ({ most: null, least: null }));
  render();
}

function pickMost(type) {
  const ans = st.answers[st.currentQ];
  if (ans.most === type) { ans.most = null; }
  else { ans.most = type; }
  render();
}

function pickLeast(type) {
  const ans = st.answers[st.currentQ];
  if (ans.least === type) { ans.least = null; }
  else { ans.least = type; }
  render();
}

function nextQ() {
  const ans = st.answers[st.currentQ];
  if (!ans.most || !ans.least) return;
  if (st.currentQ + 1 >= QUESTIONS.length) {
    const scores = calcScores();
    const sorted = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
    sendResult(st.name, sorted[0], sorted[1], scores);
    st.screen = 'result';
    render();
    setTimeout(() => {
      const max = Math.max(...Object.values(scores));
      const min = Math.min(...Object.values(scores));
      const range = max - min || 1;
      Object.entries(scores).forEach(([k, v]) => {
        const el = document.getElementById('bar-' + k);
        if (el) el.style.width = Math.max(4, Math.round((v - min) / range * 100)) + '%';
      });
    }, 100);
  } else {
    st.currentQ++;
    render();
  }
}

function calcScores() {
  // Most: +2点, Least: -1点
  const scores = {D:0, i:0, S:0, C:0};
  st.answers.forEach((ans, qi) => {
    if (ans.most) scores[ans.most] += 2;
    if (ans.least) scores[ans.least] -= 1;
  });
  return scores;
}

function prevQ() {
  if (st.currentQ > 0) { st.currentQ--; render(); }
}

function restart() {
  st = { screen:'intro', name: st.name, answers: Array.from({length:14}, ()=>({most:null,least:null})), currentQ: 0 };
  render();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render() {
  const app = document.getElementById('app');
  if (st.screen === 'intro') app.innerHTML = renderIntro();
  else if (st.screen === 'question') app.innerHTML = renderQuestion();
  else app.innerHTML = renderResult();
  window.scrollTo(0, 0);
}

render();
</script>
</body>
</html>
